# peforth Configuration
# Non-secret runtime, shell, integration, and diagnostic logging settings.
# Secrets (API keys, tokens, user IDs) belong strictly in .env.

runtime:
  config_dir: "~/.peforth"
  tmp_dir: "~/.peforth/tmp"
  skills_dir: ""
  source_path: ""
  stream_timeout_seconds: 300

shells:
  pwsh_path: ""
  wsl_distro: ""

integrations:
  line_endpoint: ""
  line_disabled: false

logging:
  level: "normal"           # "disabled" | "normal" | "verbose"
  max_output_bytes: 262144  # 256 KiB; 0 = unlimited

security:
  attention_check_rate: 0.15  # 0.0 - 1.0; occasional humorous decoy approval (0 = disabled)
