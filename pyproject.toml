[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peforth"
version = "2.1.0"
description = "peforth 2.1.0: Forth-driven AI pair programmer hosted by Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "H.C. Chen" }]
dependencies = [
    "prompt_toolkit>=3.0.52,<4"
]

[project.scripts]
f = "main:main"
peforth = "main:main"
peforth-monitor = "tools.peforth_logging_monitor:main"

[tool.setuptools]
py-modules = ["main", "projectk", "ai", "diagnostic_log", "session_store"]
packages = ["tools"]

[tool.setuptools.package-data]
"*" = ["*.f", "*.md", "skills/**/*"]

